<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇小游戏</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    color: #eee;
    user-select: none;
    -webkit-user-select: none;
  }

  h1 {
    margin-bottom: 16px;
    font-size: 2rem;
    letter-spacing: 2px;
    color: #4ade80;
    text-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
  }

  .score-board {
    display: flex;
    gap: 40px;
    margin-bottom: 16px;
    font-size: 1.1rem;
  }

  .score-board span {
    color: #facc15;
    font-weight: bold;
    font-size: 1.3rem;
  }

  .game-container {
    position: relative;
  }

  canvas {
    background: #111827;
    border: 3px solid #374151;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    display: block;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }

  .overlay h2 {
    font-size: 1.8rem;
    color: #f87171;
  }

  .overlay p {
    font-size: 1rem;
    color: #ccc;
    line-height: 1.6;
  }

  button {
    padding: 12px 32px;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    background: #4ade80;
    color: #111827;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.1s, background 0.2s;
  }

  button:hover {
    background: #22c55e;
    transform: scale(1.05);
  }

  button:active {
    transform: scale(0.95);
  }

  .tips {
    margin-top: 16px;
    color: #9ca3af;
    font-size: 0.9rem;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="score-board">
    <div>得分：<span id="score">0</span></div>
    <div>最高分：<span id="highScore">0</span></div>
  </div>
  <div class="game-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="overlay hidden" id="overlay">
      <h2 id="overlayTitle">游戏结束</h2>
      <p id="overlayText"></p>
      <button id="restartBtn">重新开始</button>
    </div>
  </div>
  <div class="tips">使用方向键（或 W A S D）控制移动 · 按空格键暂停</div>

<script>
(function() {
  // 游戏配置
  const GRID_SIZE = 20;          // 网格大小（像素）
  const COLS = 20;               // 列数
  const ROWS = 20;               // 行数
  const INITIAL_SPEED = 150;     // 初始速度（毫秒/步）
  const MIN_SPEED = 60;          // 最小间隔
  const SPEED_STEP = 3;          // 每吃一个加速

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const restartBtn = document.getElementById('restartBtn');

  canvas.width = COLS * GRID_SIZE;
  canvas.height = ROWS * GRID_SIZE;

  // 游戏状态
  let snake, direction, nextDirection, food, score, highScore;
  let gameRunning, gamePaused, gameInterval, speed;

  // 从 localStorage 读取最高分
  highScore = parseInt(localStorage.getItem('snakeHighScore') || '0', 10);
  highScoreEl.textContent = highScore;

  function initGame() {
    // 初始蛇：占三个格子，水平居中
    const startX = Math.floor(COLS / 2);
    const startY = Math.floor(ROWS / 2);
    snake = [
      { x: startX, y: startY },
      { x: startX - 1, y: startY },
      { x: startX - 2, y: startY }
    ];

    direction = { x: 1, y: 0 };      // 当前移动方向
    nextDirection = { x: 1, y: 0 };  // 下一次移动方向
    score = 0;
    speed = INITIAL_SPEED;
    gamePaused = false;
    updateScore();

    placeFood();
    draw();
    hideOverlay();
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
      localStorage.setItem('snakeHighScore', String(highScore));
    }
  }

  // 随机生成食物，避免出现在蛇身上
  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(seg => seg.x === pos.x && seg.y === pos.y));
    food = pos;
  }

  function startGame() {
    initGame();
    gameRunning = true;
    clearInterval(gameInterval);
    gameInterval = setInterval(gameStep, speed);
  }

  function pauseGame() {
    if (!gameRunning) return;
    gamePaused = true;
    clearInterval(gameInterval);
    showOverlay('暂停中', '按空格键或点击下方按钮继续', '继续');
  }

  function resumeGame() {
    if (!gameRunning || !gamePaused) return;
    gamePaused = false;
    clearInterval(gameInterval);
    gameInterval = setInterval(gameStep, speed);
    hideOverlay();
  }

  function gameStep() {
    if (!gameRunning || gamePaused) return;

    // 应用待处理的方向（防止 180 度反转）
    if ((nextDirection.x !== 0 || nextDirection.y !== 0) &&
        (nextDirection.x !== -direction.x || nextDirection.y !== -direction.y)) {
      direction = nextDirection;
    }

    const head = snake[0];
    const newHead = { x: head.x + direction.x, y: head.y + direction.y };

    // 墙壁碰撞检测
    if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
      endGame();
      return;
    }

    // 自身碰撞检测（注意：如果吃到食物尾巴会保留，需看是否吃到食物）
    const willEat = (newHead.x === food.x && newHead.y === food.y);
    const bodyToCheck = willEat ? snake : snake.slice(0, -1);
    if (bodyToCheck.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
      endGame();
      return;
    }

    // 移动
    snake.unshift(newHead);

    if (willEat) {
      score++;
      updateScore();
      placeFood();

      // 加速
      if (speed > MIN_SPEED) {
        speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
        clearInterval(gameInterval);
        gameInterval = setInterval(gameStep, speed);
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame() {
    gameRunning = false;
    clearInterval(gameInterval);
    showOverlay('游戏结束', '最终得分：' + score + ' 分', '重新开始');
  }

  function showOverlay(title, text, btnText) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    restartBtn.textContent = btnText;
    overlay.classList.remove('hidden');
  }

  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  // 绘制
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 绘制网格线
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID_SIZE, 0);
      ctx.lineTo(i * GRID_SIZE, canvas.height);
      ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * GRID_SIZE);
      ctx.lineTo(canvas.width, i * GRID_SIZE);
      ctx.stroke();
    }

    // 绘制食物
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(
      food.x * GRID_SIZE + GRID_SIZE / 2,
      food.y * GRID_SIZE + GRID_SIZE / 2,
      GRID_SIZE / 2 - 2, 0, Math.PI * 2
    );
    ctx.fill();
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(
      food.x * GRID_SIZE + GRID_SIZE / 2,
      food.y * GRID_SIZE + GRID_SIZE / 2,
      GRID_SIZE / 2 - 7, 0, Math.PI * 2
    );
    ctx.fill();

    // 绘制蛇
    for (let i = 0; i < snake.length; i++) {
      const seg = snake[i];
      const pad = 1;
      if (i === 0) {
        // 蛇头
        ctx.fillStyle = '#4ade80';
        ctx.fillRect(seg.x * GRID_SIZE + pad, seg.y * GRID_SIZE + pad, GRID_SIZE - pad * 2, GRID_SIZE - pad * 2);
        // 蛇头眼睛
        ctx.fillStyle = '#111827';
        const ex = seg.x * GRID_SIZE + GRID_SIZE / 2;
        const ey = seg.y * GRID_SIZE + GRID_SIZE / 2;
        ctx.beginPath();
        ctx.arc(ex - 3, ey - 2, 2, 0, Math.PI * 2);
        ctx.arc(ex + 3, ey - 2, 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 蛇身（渐变颜色）
        const t = i / snake.length;
        const g = Math.round(150 - t * 90);
        ctx.fillStyle = 'rgb(74, ' + g + ', 128)';
        ctx.fillRect(seg.x * GRID_SIZE + pad, seg.y * GRID_SIZE + pad, GRID_SIZE - pad * 2, GRID_SIZE - pad * 2);
      }
    }
  }

  // 键盘控制
  function handleKey(e) {
    const key = e.key;
    e.preventDefault();

    // 方向键 / WASD
    let newDir = null;
    if (key === 'ArrowUp' || key === 'w' || key === 'W') newDir = { x: 0, y: -1 };
    else if (key === 'ArrowDown' || key === 's' || key === 'S') newDir = { x: 0, y: 1 };
    else if (key === 'ArrowLeft' || key === 'a' || key === 'A') newDir = { x: -1, y: 0 };
    else if (key === 'ArrowRight' || key === 'd' || key === 'D') newDir = { x: 1, y: 0 };

    if (newDir) {
      // 防止直接 180 度反转（基于当前 direction）
      if (!(newDir.x === -direction.x && newDir.y === -direction.y)) {
        nextDirection = newDir;
      }
      return;
    }

    // 空格：暂停 / 继续
    if (key === ' ' || key === 'Spacebar') {
      if (!gameRunning) {
        startGame();
      } else if (gamePaused) {
        resumeGame();
      } else {
        pauseGame();
      }
    }

    // 回车：重新开始
    if (key === 'Enter') {
      startGame();
    }
  }

  // 移动端触摸控制（可选）
  let touchStartX = 0, touchStartY = 0;
  function handleTouchStart(e) {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }
  function handleTouchEnd(e) {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    let newDir;
    if (Math.abs(dx) > Math.abs(dy)) {
      newDir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
    } else {
      newDir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
    }
    if (!(newDir.x === -direction.x && newDir.y === -direction.y)) {
      nextDirection = newDir;
    }
  }

  restartBtn.addEventListener('click', function() {
    if (gamePaused) {
      resumeGame();
    } else {
      startGame();
    }
  });

  document.addEventListener('keydown', handleKey);
  canvas.addEventListener('touchstart', handleTouchStart, { passive: true });
  canvas.addEventListener('touchend', handleTouchEnd, { passive: true });

  // 初始启动
  initGame();
})();
</script>
</body>
</html>
